<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento | OVNI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="../css/painel.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../js/painel.js" defer></script>
</head>
<body>

    <header class="top-bar">
        <div class="logo-area">
            <span>Monitoramento ADS-B</span>
        </div>
        <div class="user-area">
            <span id="userDisplay">Usuário</span>
            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>
    </header>

    <div class="main-layout">

        <aside class="sidebar">


            <h3>Filtros de Busca</h3>

            <div class="filter-group">
                <label>Data Início:</label>
                <input type="date" id="dataInicio" class="form-control">
            </div>

            <div class="filter-group">
                <label>Data Fim:</label>
                <input type="date" id="dataFim" class="form-control">
            </div>

            <button onclick="buscarDados()" class="btn-search">
                Buscar Voos
            </button>

            <button onclick="baixarRelatorio()" class="btn-download" id="btnDownload" disabled>
                Baixar Relatório (CSV)
            </button>

            <hr>

            <div class="stats-box">
                <h4>Status</h4>
                <p id="statusMsg">Aguardando...</p>
                <p>Voos carregados: <strong id="totalVoos">0</strong></p>
            </div>

        </aside>
        <main style="flex: 1; padding: 20px; overflow: auto; background-color: #1e1e1e;">
            <h3 style="color: #0d6efd; margin-bottom: 20px;">Dados Obtidos(JSON)</h3>

            <div id="json-container"></div>
        </main>
    </div>
</body>
</html>
