<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVNI - Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
</head>
<body>

    <header class="top-bar">
    </header>

    <main class="center-container">

        <div class="logo-area">
            <img src="../img/Ovni.png" alt="Logo OVNI" class="main-logo">
        </div>

        <div class="form-area">

            <div class="input-wrapper">
                <input type="text" id="inputApiKey" placeholder="Insira sua Chave de Acesso">
                <button onclick="acessarSistema()" class="btn-action">Entrar</button>
            </div>

            <div class="divider">ou</div>

            <div class="input-wrapper">
                <input type="email" id="inputEmail" placeholder="email / codPessoa">
                <div class="row-inputs">
                    <input type="text" id="inputNome" placeholder="Nome" style="width: 48%;">
                    <input type="text" id="inputSobrenome" placeholder="Sobrenome" style="width: 48%;">
                </div>
                <button onclick="gerarChave()" class="btn-secondary">Gerar Nova Chave</button>
            </div>

            <div id="mensagemFeedback" class="feedback-msg"></div>

            <div id="resultadoChave" class="mt-3 p-3 border rounded bg-white d-none" style="border: 1px solid #dee2e6; border-radius: 8px;">
                <h6 class="text-success fw-bold mb-2" style="color: #198754; font-size: 0.9rem;"> Chave Gerada!</h6>

                <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; font-family: monospace; word-break: break-all; margin-bottom: 10px; font-weight: bold; color: #333;">
                    <span id="displayChaveGerada">...</span>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="copiarChaveLogin()" class="btn-secondary" style="font-size: 0.8rem; height: 35px;">
                        Copiar
                    </button>
                    <button onclick="baixarChaveTxtLogin()" class="btn-action" style="font-size: 0.8rem; height: 35px; background-color: #198754;">
                        Baixar .txt
                    </button>
                </div>
                <p style="font-size: 0.75rem; color: #6c757d; margin-top: 8px; margin-bottom: 0;">
                    Salve esta chave. Você precisará dela para entrar.
                </p>
            </div>

        </div>
    </main>

    <div class="footer-logo">
        <img src="../img/brasao-pucminas-2025_PRETO.png" alt="Brasão PUC">
    </div>

</body>
</html>
